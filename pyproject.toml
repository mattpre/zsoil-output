[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zsoil-output"
version = "0.1.0"
description = "Read ZSoil FEM result files (mesh, history of execution, nodal/element/beam/shell/contact results) from Python."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "xlrd",
    "xlwt",
]

# This SDK's ~60 modules (C_Mesh, C_NodalResults, C_HistoryOfExecution, ...)
# import each other unqualified, e.g. `from C_Element import *` inside
# C_Mesh.py -- there is no internal package prefix. `py-modules` installs
# them as flat top-level modules (not nested under a `zsoil_output/`
# package), which preserves both those internal imports and every existing
# `from C_Mesh import ...` call site in downstream code without changes.
[tool.setuptools]
py-modules = [
    "C_BeamResults",
    "C_Beam_S_Results",
    "C_Contact_2D_Results",
    "C_Contact_3D_Results",
    "C_ContinuumResults",
    "C_Diagram",
    "C_Diagram3D",
    "C_DriversType",
    "C_EleLayersResults",
    "C_EleResults",
    "C_Element",
    "C_Element_B8_generic",
    "C_Element_L2D_generic",
    "C_Element_Q4V_generic",
    "C_Element_Q4_generic",
    "C_Element_Surf_generic",
    "C_Element_T3V_generic",
    "C_Element_T3_generic",
    "C_Element_Volumic_generic",
    "C_Element_beam_L2",
    "C_Element_cnt_L2",
    "C_Element_cnt_Q4",
    "C_Element_cnt_T3",
    "C_Element_cnt_bond_L2",
    "C_Element_cnt_tip",
    "C_Element_cont_B8",
    "C_Element_cont_Q4",
    "C_Element_cont_T3",
    "C_Element_cont_TH4",
    "C_Element_cont_W6",
    "C_Element_heat_exch_L2",
    "C_Element_memb_L2",
    "C_Element_memb_Q4",
    "C_Element_memb_T3",
    "C_Element_rsl",
    "C_Element_s_beam_L2",
    "C_Element_shell_Q4",
    "C_Element_shell_SHQ4",
    "C_Element_shell_T3",
    "C_Element_truss_L2",
    "C_Exf",
    "C_Heat_Exch_Results",
    "C_HistoryOfExecution",
    "C_Ltf",
    "C_Material",
    "C_Mesh",
    "C_NodalResults",
    "C_Node",
    "C_PlasticCodes",
    "C_Rcf_info",
    "C_Rcf_layers_info",
    "C_ShellResults",
    "C_TrussResults",
    "C_math_utl",
    "ExcelUtl",
    "ExecutionLOG",
    "ZSoil_version",
    "version",
]
