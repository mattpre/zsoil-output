[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zsoil-output"
version = "0.1.0"
description = "Read ZSoil FEM result files (mesh, history of execution, nodal/element/beam/shell/contact results) from Python."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "xlrd",
    "xlwt",
]

[tool.setuptools.packages.find]
where = ["src"] # Explicitly binds "import zsoil_output" to your src directory
